name: kejasha

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: kejasha
      APP_AUTHENTICATED_PASSWORD: ${APP_AUTHENTICATED_PASSWORD:-secret}
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_owner -d kejasha']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible storage for dev (ADR-019; production uses Cloudflare R2).
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ['server', '-s3', '-s3.config=/etc/seaweedfs/s3.json', '-dir=/data']
    ports: ['9000:8333']
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
  redisdata:
  s3data:
