name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  checks:
    name: typecheck · lint · tests · spec
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit
        run: pnpm test:unit
      - name: Integration (Testcontainers)
        run: pnpm test:int
      - name: RLS isolation
        run: pnpm test:rls
      - name: Journeys (generated client)
        run: pnpm test:journeys
      - name: Spec is up to date
        run: pnpm --filter @kejasha/api spec:check
      - name: Spec lint (ADR-002/017 rules + Redocly)
        run: pnpm --filter @kejasha/api spec:lint
      - name: Generated client is up to date
        run: |
          pnpm --filter @kejasha/api-client generate
          git diff --exit-code -- packages/api-client
      - name: No breaking API changes vs main (oasdiff)
        if: github.event_name == 'pull_request'
        run: |
          git show origin/${{ github.base_ref }}:apps/api/openapi.json > /tmp/base.json 2>/dev/null || { echo "no base spec yet"; exit 0; }
          docker run --rm -v /tmp:/base -v "$PWD/apps/api":/head tufin/oasdiff breaking /base/base.json /head/openapi.json --fail-on ERR

  contract:
    name: schemathesis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app_owner, POSTGRES_PASSWORD: secret, POSTGRES_DB: kejasha }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U app_owner" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      NODE_ENV: test
      APP_DOMAIN: localhost
      DATABASE_URL: postgresql://app_owner:secret@localhost:5432/kejasha?sslmode=disable
      DATABASE_AUTHENTICATED_URL: postgresql://app_authenticated:secret@localhost:5432/kejasha?sslmode=disable
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Provision tenant login role + migrate
        run: |
          PGPASSWORD=secret psql -h localhost -U app_owner -d kejasha -c "CREATE ROLE app_authenticated LOGIN NOBYPASSRLS PASSWORD 'secret'"
          pnpm exec dbmate --no-dump-schema --migrations-dir infra/migrations up
      - name: Boot API
        run: |
          pnpm --filter @kejasha/api build
          (cd apps/api && node dist/server.js > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:4000/v1/health && break; sleep 1; done
      - name: Seed demo data (gives an authenticated token)
        run: pnpm --filter @kejasha/api seed
      - name: Schemathesis (all operations, authenticated)
        run: |
          docker run --rm --network host -v "$PWD/schemathesis.toml:/cfg/schemathesis.toml:ro" \
            schemathesis/schemathesis:stable --config-file /cfg/schemathesis.toml \
            run http://localhost:4000/openapi.json --url http://localhost:4000 --checks all --max-examples 100 \
            --exclude-operation-id signOut \
            -H "Authorization: Bearer $(cat apps/api/.seed-token)"
      - if: failure()
        run: cat /tmp/api.log

  images:
    name: docker images (linux/amd64)
    runs-on: ubuntu-latest
    needs: [checks]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --platform linux/amd64 -f apps/api/Dockerfile -t kejasha-api:ci .
      - run: docker build --platform linux/amd64 -f apps/worker/Dockerfile -t kejasha-worker:ci .
